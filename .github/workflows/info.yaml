name: [MurCoda] Info

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  write-js:
    runs-on: ubuntu-latest

    steps:
      - name: [MurCoda] Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: [MurCoda] Generate temp block
        id: make-vars
        shell: bash
        run: |
          cat > .wincat-block.tmp <<'BLOCK'
// INFO START
let wincat_owner = "${{ github.repository_owner }}";
let wincat_repo = "${{ github.event.repository.name }}";
let wincat_fullRepo = "${{ github.repository }}";
let wincat_branch = "${{ github.ref_name }}";
let wincat_sha = "${{ github.sha }}";
let wincat_event = "${{ github.event_name }}";
let wincat_createdAt = "$(date -u +"%Y-%m-%dT%H:%M:%SZ")";
let wincat_url = "https://github.com/${{ github.repository }}";
// INFO END
BLOCK
          export G_OWNER="${{ github.repository_owner }}"
          export G_REPO="${{ github.event.repository.name }}"
          export G_FULL="${{ github.repository }}"
          export G_BRANCH="${{ github.ref_name }}"
          export G_SHA="${{ github.sha }}"
          export G_EVENT="${{ github.event_name }}"
          export G_URL="https://github.com/${{ github.repository }}"

          sed \
            -e "s|\${{ github.repository_owner }}|$G_OWNER|g" \
            -e "s|\${{ github.event.repository.name }}|$G_REPO|g" \
            -e "s|\${{ github.repository }}|$G_FULL|g" \
            -e "s|\${{ github.ref_name }}|$G_BRANCH|g" \
            -e "s|\${{ github.sha }}|$G_SHA|g" \
            -e "s|\${{ github.event_name }}|$G_EVENT|g" \
            -e "s|https://github.com/\${{ github.repository }}|$G_URL|g" \
            .wincat-block.tmp > .wincat-block-final.tmp

      - name: [MurCoda] Replace block in repo.js
        shell: bash
        run: |
          input="repo.js"
          block=".wincat-block-final.tmp"

          if [ ! -f "$input" ]; then
            {
              echo "// INFO START"
              cat "$block"
              echo "// INFO END"
            } > "$input"
            exit 0
          fi

          if grep -q "// INFO START" "$input" && grep -q "// INFO END" "$input"; then

            end_line=$(grep -n "// INFO END" "$input" | head -1 | cut -d: -f1)
            
            head -n "$end_line" "$input" > .repo.head.tmp
            
            tail -n +$((end_line + 1)) "$input" > .repo.tail.tmp

            {
              cat .repo.head.tmp
              echo ""
              cat "$block"
              echo ""
              if [ -s .repo.tail.tmp ]; then
                cat .repo.tail.tmp
              fi
            } > "$input.new"

            mv "$input.new" "$input"
          else
            echo "" >> "$input"
            cat "$block" >> "$input"
          fi

      - name: [MurCoda] Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[MurCoda] INFO"
          branch: main
          file_pattern: "repo.js"
